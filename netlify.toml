# Netlify — sitio estático (sin build)
[build]
  publish = "."
  command = ""

# SPA fallback: cualquier ruta desconocida sirve el sitio
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sin caché para los archivos del shell PWA (para que el SW controle versionado)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
