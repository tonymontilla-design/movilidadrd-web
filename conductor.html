<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MovilidadRD">
<meta name="theme-color" content="#151515">
<title>Portal del Conductor — MovilidadRD</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex,nofollow">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brand.css">
</head>
<body style="background:#151515; min-height:100vh;">

<!-- ══════════ LOGIN ══════════ -->
<div id="vistaLogin" class="d-flex align-items-center justify-content-center" style="min-height:100vh; padding:1rem;">
  <div class="mrd-form p-4" style="max-width:24rem; width:100%;">
    <img src="assets/icons/logo-horizontal.svg" alt="MovilidadRD" height="48" class="mb-4">
    <h1 class="h5 mb-1">Portal del conductor</h1>
    <p class="text-muted small mb-4">Acceso solo para conductores autorizados.</p>
    <form id="formLogin" novalidate>
      <label class="form-label" for="loginEmail">Correo</label>
      <input class="form-control mb-3" id="loginEmail" type="email" required autocomplete="username" inputmode="email" placeholder="conductor@movilidadrd.com">
      <label class="form-label" for="loginPass">Contraseña</label>
      <input class="form-control mb-3" id="loginPass" type="password" required autocomplete="current-password" placeholder="••••••••••">
      <button type="submit" class="btn btn-mrd w-100 py-2" id="btnLogin"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
      <div class="alert alert-danger d-none mt-3 mb-0 small" id="loginError" role="alert"></div>
    </form>
    <a href="index.html" class="d-block text-center small mt-4 text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Volver al sitio público</a>
  </div>
</div>

<!-- ══════════ PORTAL ══════════ -->
<div id="vistaPortal" class="d-none" style="min-height:100vh; background:var(--mrd-gris-claro);">
  <header class="d-flex align-items-center justify-content-between px-3 py-2" style="background:#151515; position:sticky; top:0; z-index:10;">
    <div class="d-flex align-items-center gap-2">
      <img src="assets/icons/icon.svg" alt="" width="34" height="34">
      <div>
        <div style="color:#fff; font-family:Montserrat; font-weight:700; font-size:.95rem; line-height:1;">MOVILIDAD<span style="color:#C6A56B;">RD</span></div>
        <div class="small" style="color:#C6A56B; font-size:.68rem;" id="nombreConductor">Conductor</div>
      </div>
    </div>
    <button class="btn btn-sm btn-outline-light" id="btnSalir" aria-label="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
  </header>

  <main class="container-fluid p-3" style="max-width:560px;">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h1 class="h6 mb-0 text-muted text-uppercase" style="letter-spacing:.1em;">Mis viajes de hoy</h1>
      <button class="btn btn-sm btn-outline-dark" id="btnRefrescar"><i class="bi bi-arrow-clockwise"></i></button>
    </div>

    <div id="listaViajes"></div>

    <div class="mrd-vacio d-none" id="sinViajes">
      <i class="bi bi-calendar-check d-block mb-2"></i>
      <p class="mb-1">Sin viajes asignados por ahora.</p>
      <p class="small text-muted mb-0">Cuando administración te asigne un servicio, aparecerá aquí con todos los detalles.</p>
    </div>

    <div class="mrd-form p-3 mt-3">
      <h2 class="h6 mb-2"><i class="bi bi-info-circle text-dorado me-1"></i>Estados de un viaje</h2>
      <div class="d-flex flex-wrap gap-2 small" id="leyendaEstados"></div>
    </div>
  </main>
</div>

<script src="js/config.js" onerror="console.warn('js/config.js no encontrado')"></script>
<script src="js/api.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/conductor.js"></script>
</body>
</html>
